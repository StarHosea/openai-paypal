name: Diagnose Server

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          script: |
            OUT=/tmp/paypal-hao-diagnose.txt
            {
              echo '=== find hao ==='
              sudo find /opt/1panel /etc /www -iname '*hao.shuangdeng*' 2>/dev/null | head -40
              sudo grep -RIl 'hao\.shuangdeng\.space' /opt/1panel /etc/nginx /www 2>/dev/null | head -30
              echo '=== conf.d listing ==='
              ls -la /opt/1panel/www/conf.d/ 2>/dev/null || true
              echo '=== hao config ==='
              for f in $(sudo grep -RIl 'hao\.shuangdeng\.space' /opt/1panel /etc/nginx /www 2>/dev/null | head -15); do
                echo "----- $f -----"
                sudo sed -n '1,260p' "$f"
              done
              echo '=== pix config ==='
              sudo sed -n '1,260p' /opt/1panel/www/conf.d/pix.shuangdeng.space.conf 2>/dev/null || true
              echo '=== health ==='
              curl -fsS http://127.0.0.1:18080/api/health; echo
              systemctl is-active openai-paypal-web; echo
            } >"$OUT" 2>&1
            cat "$OUT"
