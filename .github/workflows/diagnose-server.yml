name: Diagnose Server

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          script: |
            OUT=/tmp/paypal-diagnose.txt
            {
              echo '=== ports ==='
              sudo ss -ltnp | grep -E ':80 |:443 |:8080 |:18080 ' || true
              echo '=== openresty exe ==='
              PID=$(pgrep -o openresty || true)
              echo "pid=$PID"
              if [[ -n "$PID" ]]; then
                sudo readlink -f "/proc/$PID/exe" || true
                sudo tr '\0' ' ' < "/proc/$PID/cmdline"; echo
              fi
              echo '=== find hhao config ==='
              sudo grep -RIl 'hhao\.shuangdeng\.space' /etc /www /usr/local /opt 2>/dev/null | head -30
              echo '=== hhao config contents ==='
              for f in $(sudo grep -RIl 'hhao\.shuangdeng\.space' /etc /www /usr/local /opt 2>/dev/null | head -10); do
                echo "----- $f -----"
                sudo sed -n '1,220p' "$f"
              done
              echo '=== find pix config ==='
              sudo grep -RIl 'pix\.shuangdeng\.space' /etc /www /usr/local /opt 2>/dev/null | head -20
              echo '=== docker ports ==='
              docker ps --format 'table {{.Names}}\t{{.Ports}}\t{{.Image}}' || true
              echo '=== journal ==='
              sudo journalctl -u openai-paypal-web -n 20 --no-pager || true
            } >"$OUT" 2>&1
            cat "$OUT"
