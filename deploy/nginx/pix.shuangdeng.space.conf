# Nginx reverse proxy for PayPal Web UI
# Install: sudo cp deploy/nginx/pix.shuangdeng.space.conf /etc/nginx/sites-available/
#          sudo ln -sf /etc/nginx/sites-available/pix.shuangdeng.space.conf /etc/nginx/sites-enabled/
# SSL:     sudo certbot --nginx -d pix.shuangdeng.space

upstream openai_paypal_web {
    server 127.0.0.1:8080;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name pix.shuangdeng.space;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pix.shuangdeng.space;

    # Certbot will populate these paths on first run.
    ssl_certificate     /etc/letsencrypt/live/pix.shuangdeng.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pix.shuangdeng.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2m;

    location / {
        proxy_pass http://openai_paypal_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
